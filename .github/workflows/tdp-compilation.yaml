name: TDP Compilation

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'tdp/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tdp/**'

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tec-andres/tdp-texmake:ci

jobs:
  compile:
    name: Compile tdp/main.tex
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull compiler image
        run: docker pull "$IMAGE"

      # shell_escape lets the svg package launch Inkscape itself; texmake on
      # LaTeX-Compiler main does not pass -shell-escape yet. Files are written
      # as the runner user so the artifacts are readable by the job.
      - name: Compile document
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e shell_escape=t \
            -v "$GITHUB_WORKSPACE:/docs" \
            -w /workspace \
            "$IMAGE" \
            bash -lc 'python3 /workspace/src/texmake.py /docs/tdp'

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: tdp-pdf
          path: tdp/__release__/main.pdf
          if-no-files-found: error

      - name: Publish failure details
        if: failure()
        run: |
          log="tdp/__texcache__/main.log"
          {
            echo "### TDP compilation failed"
            echo '```'
            if [ -f "$log" ]; then
              if grep -q '^!' "$log"; then grep -A 5 '^!' "$log" | head -n 80; else tail -n 40 "$log"; fi
            else
              echo "no log was produced at $log"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compile log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tdp-compile-log
          path: tdp/__texcache__/main.log
          if-no-files-found: ignore
