name: Compiler Image

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    paths:
      - '.github/docker/**'
      - '.github/workflows/image.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/tec-andres/tdp-texmake

jobs:
  publish:
    name: Build and publish texmake image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout LaTeX-Compiler
        uses: actions/checkout@v4
        with:
          repository: TEC-Andres/LaTeX-Compiler
          path: .latex-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
